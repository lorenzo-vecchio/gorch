name: Fuzz

# Both fuzz targets run on every pull request for a short, bounded window, and
# on the nightly schedule for a longer one (issue #54). The PR run is a
# smoke test that the targets still build and find nothing immediately; the
# scheduled run is where deeper exploration happens. A crash is committed by Go
# to testdata/fuzz and fails the job.

on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzTypedSubscribeDecode, FuzzGroupSurface]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Fuzz ${{ matrix.target }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            fuzztime=180s
          else
            fuzztime=20s
          fi
          go test . -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$fuzztime"
