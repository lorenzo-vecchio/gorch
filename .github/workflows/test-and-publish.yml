name: Test & Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go test . -race -coverprofile=coverage.out
      - run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          if [ "$total" != "100.0" ]; then
            echo "Coverage is $total%, need 100.0%"
            exit 1
          fi
      - run: go vet ./...
  # The benchmark regression gate (bench.yml) runs only here, at release time:
  # `publish` waits on it, so a benchmark regression blocks the release instead
  # of the gate running on every push.
  bench:
    uses: ./.github/workflows/bench.yml
  publish:
    needs: [test, bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
