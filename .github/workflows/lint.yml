name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
