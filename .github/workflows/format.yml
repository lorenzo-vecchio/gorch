name: Format
on: [push, workflow_dispatch]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: gofmt -w .
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: gofmt"
